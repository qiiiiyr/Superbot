[project]
name = "superbot"
version = "0.1.0"
description = "Dropshipping automation bot with an owner approval queue"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "apscheduler>=3.10,<4",
    "anthropic",
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
]

[project.scripts]
superbot = "superbot.main:run"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["superbot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
